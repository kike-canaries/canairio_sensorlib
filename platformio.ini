; CanAirIO Sensorlib
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = ./examples/
lib_dir = ./
extra_configs = unified-lib-deps.ini

[env]
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = 
  esp32_exception_decoder
  time
lib_deps = ${commonlibs.lib_deps}
build_flags = 
  -D CORE_DEBUG_LEVEL=0
  -D ARDUINO_ESP32_DEV=1
  -Wall
  -Wextra

[esp32_common]
platform = espressif32
board = esp32dev

[esp8266_common]
extends = common
platform = espressif8266
board = esp12e

[atmelsam_common]
extends = common
platform = atmelsam
board = seeed_wio_terminal

[env:esp32]
extends = esp32_common
build_src_filter = -<*> +<advanced_multivariable/>

[env:esp32c3]
extends = esp32_common
board = esp32-c3-devkitm-1
build_src_filter = -<*> +<advanced_multivariable/>
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:AG_OPENAIR]
extends = esp32_common
board = esp32-c3-devkitm-1
board_build.f_flash = 40000000L
build_src_filter = -<*> +<advanced_multivariable/>
build_flags = 
  ${env.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D SLIB_I2C_SDA=7
  -D SLIB_I2C_SCL=6
   ; Second UART for the SenseAir S8 CO2 sensor (UART1 on ESP32-C3)
  -D SLIB_UART2_RX=2
  -D SLIB_UART2_TX=3

[env:esp32s2]
extends = esp32_common
board = lolin_s2_mini
build_src_filter = -<*> +<advanced_multivariable/>
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSLIB_I2C_SDA=8
  -DSLIB_I2C_SCL=9

[env:esp32s3]
extends = esp32_common
board = seeed_xiao_esp32s3
build_src_filter = -<*> +<advanced_multivariable/>
build_flags = 
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM=1
  -DSLIB_I2C_SDA=5
  -DSLIB_I2C_SCL=6

[env:esp8266]
extends = esp8266_common
build_src_filter = -<*> +<advanced_multivariable/>
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_ESP8266_ESP12E=1
  -D INCLUDE_SOFTWARE_SERIAL=1

[env:atmelsam]
extends = atmelsam_common
build_src_filter = -<*> +<wio_terminal_basic/>
