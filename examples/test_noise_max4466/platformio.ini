[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    kike-canaries/CanAirIO Air Quality Sensors Library

build_flags =
    -DCORE_DEBUG_LEVEL=3

[env:esp32s2]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    kike-canaries/CanAirIO Air Quality Sensors Library

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DSLIB_I2C_SDA=8
    -DSLIB_I2C_SCL=9
    -DARDUINO_USB_CDC_ON_BOOT=1

